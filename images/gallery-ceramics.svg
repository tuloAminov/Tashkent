<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="ceramicsBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="largeLaganGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="ceramicsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#ceramicsBg)"/>

  <!-- Table surface -->
  <ellipse cx="300" cy="360" rx="280" ry="80" fill="#18120c"/>

  <!-- Spotlight Glow -->
  <circle cx="300" cy="200" r="180" fill="#38bdf8" opacity="0.12"/>

  <!-- --- LARGE RISHTAN CERAMIC LAGAN (Большой расписной ляган) --- -->
  <g filter="url(#ceramicsShadow)">
    <!-- Base Plate -->
    <ellipse cx="300" cy="210" rx="190" ry="120" fill="url(#largeLaganGrad)"/>
    <!-- Outer glazed rim -->
    <ellipse cx="300" cy="210" rx="175" ry="110" fill="none" stroke="#0284c7" stroke-width="8"/>
    <ellipse cx="300" cy="210" rx="165" ry="102" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="8 6"/>

    <!-- Intricate Eastern floral rosettes on plate interior -->
    <!-- Center medallion -->
    <ellipse cx="300" cy="210" rx="65" ry="40" fill="#0369a1"/>
    <ellipse cx="300" cy="210" rx="45" ry="28" fill="#38bdf8"/>
    <ellipse cx="300" cy="210" rx="25" ry="16" fill="#f0fdf4"/>
    <circle cx="300" cy="210" r="8" fill="#0284c7"/>

    <!-- Rosette rays and floral petals -->
    <path d="M300 170 Q315 190 300 210 Q285 190 300 170 Z" fill="#0284c7"/>
    <path d="M300 250 Q315 230 300 210 Q285 230 300 250 Z" fill="#0284c7"/>
    <path d="M235 210 Q265 220 300 210 Q265 200 235 210 Z" fill="#0284c7"/>
    <path d="M365 210 Q335 220 300 210 Q335 200 365 210 Z" fill="#0284c7"/>

    <path d="M255 180 Q280 195 300 210 Q275 200 255 180 Z" fill="#0ea5e9"/>
    <path d="M345 240 Q320 225 300 210 Q325 220 345 240 Z" fill="#0ea5e9"/>
    <path d="M345 180 Q320 195 300 210 Q325 200 345 180 Z" fill="#0ea5e9"/>
    <path d="M255 240 Q280 225 300 210 Q275 220 255 240 Z" fill="#0ea5e9"/>

    <!-- Turquoise rim petal borders -->
    <g stroke="#0369a1" stroke-width="2.5" fill="none">
      <ellipse cx="300" cy="210" rx="140" ry="85" stroke-dasharray="12 8"/>
      <ellipse cx="300" cy="210" rx="110" ry="68" stroke-dasharray="10 6"/>
    </g>

    <!-- Glaze shine / specular reflection highlight -->
    <path d="M200 170 Q240 145 320 155" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- --- MINI PIALAS (Пиалы ручной работы) ON SIDES --- -->
  <!-- Left Piala -->
  <g filter="url(#ceramicsShadow)">
    <path d="M90 280 C90 330 180 330 180 280 Z" fill="#0284c7"/>
    <ellipse cx="135" cy="280" rx="45" ry="18" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="135" cy="280" rx="36" ry="12" fill="#0369a1"/>
    <ellipse cx="135" cy="280" rx="20" ry="7" fill="#38bdf8"/>
    <!-- Ornament on cup -->
    <path d="M110 300 Q135 315 160 300" stroke="#f8fafc" stroke-width="3" fill="none"/>
  </g>

  <!-- Right Piala -->
  <g filter="url(#ceramicsShadow)">
    <path d="M420 280 C420 330 510 330 510 280 Z" fill="#0284c7"/>
    <ellipse cx="465" cy="280" rx="45" ry="18" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="465" cy="280" rx="36" ry="12" fill="#0369a1"/>
    <ellipse cx="465" cy="280" rx="20" ry="7" fill="#38bdf8"/>
    <!-- Ornament on cup -->
    <path d="M440 300 Q465 315 490 300" stroke="#f8fafc" stroke-width="3" fill="none"/>
  </g>
</svg>
