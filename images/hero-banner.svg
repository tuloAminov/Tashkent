<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background atmospheric glow -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b1d0c" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1c130d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0907" stop-opacity="1"/>
    </radialGradient>

    <!-- Warm Fire Glow from Kazan Hearth -->
    <radialGradient id="hearthGlow" cx="50%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#b45309" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ceramic Lagan Gradients -->
    <radialGradient id="laganRim" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#0369a1"/>
      <stop offset="90%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <radialGradient id="laganGlaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="75%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>

    <!-- Plov Hill Gradient -->
    <radialGradient id="plovMound" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Meat chunks gradient -->
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#2a040e"/>
    </linearGradient>

    <!-- Garlic -->
    <linearGradient id="garlicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="plovGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep moody background -->
  <rect width="1920" height="1080" fill="url(#darkBg)"/>

  <!-- Warm hearth glow -->
  <rect width="1920" height="1080" fill="url(#hearthGlow)"/>

  <!-- Subtle oriental geometric pattern watermark in background -->
  <g opacity="0.04" stroke="#f59e0b" stroke-width="1.5" fill="none">
    <circle cx="960" cy="540" r="400"/>
    <circle cx="960" cy="540" r="500"/>
    <circle cx="960" cy="540" r="600"/>
    <path d="M460 540 L1460 540 M960 40 L960 1040 M606 186 L1314 894 M606 894 L1314 186"/>
  </g>

  <!-- Giant Rishtan Ceramic Platter (Lagan) with Traditional Plov -->
  <g transform="translate(0, 160)" filter="url(#softShadow)">
    <!-- Lagan Base / Outer Rim -->
    <ellipse cx="960" cy="620" rx="680" ry="290" fill="url(#laganRim)"/>
    <ellipse cx="960" cy="620" rx="650" ry="270" fill="#0284c7" stroke="#38bdf8" stroke-width="4" stroke-dasharray="24 16"/>
    <!-- Glazed inside ceramic surface -->
    <ellipse cx="960" cy="620" rx="600" ry="245" fill="url(#laganGlaze)"/>
    <!-- Ornaments on ceramic -->
    <ellipse cx="960" cy="620" rx="550" ry="220" fill="none" stroke="#0284c7" stroke-width="3" opacity="0.45"/>

    <!-- Mountainous Plov mound -->
    <ellipse cx="960" cy="600" rx="500" ry="190" fill="url(#plovMound)"/>

    <!-- Rice grains and carrot texture -->
    <g fill="#fef08a" opacity="0.85">
      <ellipse cx="880" cy="580" rx="16" ry="6" transform="rotate(25 880 580)"/>
      <ellipse cx="1040" cy="570" rx="18" ry="6" transform="rotate(-15 1040 570)"/>
      <ellipse cx="940" cy="610" rx="16" ry="7" transform="rotate(40 940 610)"/>
      <ellipse cx="1080" cy="615" rx="15" ry="6" transform="rotate(-30 1080 615)"/>
      <ellipse cx="800" cy="595" rx="17" ry="6" transform="rotate(10 800 595)"/>
      <ellipse cx="1140" cy="590" rx="18" ry="7" transform="rotate(-20 1140 590)"/>
      <ellipse cx="840" cy="640" rx="15" ry="6" transform="rotate(50 840 640)"/>
      <ellipse cx="1020" cy="650" rx="16" ry="6.5" transform="rotate(-10 1020 650)"/>
      <ellipse cx="920" cy="540" rx="15" ry="6" transform="rotate(15 920 540)"/>
      <ellipse cx="1100" cy="550" rx="17" ry="6" transform="rotate(-35 1100 550)"/>
      <ellipse cx="740" cy="610" rx="16" ry="6" transform="rotate(18 740 610)"/>
      <ellipse cx="1190" cy="615" rx="16" ry="6" transform="rotate(-22 1190 615)"/>
      <ellipse cx="980" cy="590" rx="15" ry="6" transform="rotate(33 980 590)"/>
      <ellipse cx="890" cy="645" rx="16" ry="6" transform="rotate(-40 890 645)"/>
    </g>

    <!-- Yellow carrot strips (Sariq sabzi) -->
    <g stroke="#f97316" stroke-width="7" stroke-linecap="round" opacity="0.95">
      <path d="M780 600 Q830 590 880 605"/>
      <path d="M1040 580 Q1090 570 1140 590"/>
      <path d="M910 635 Q970 645 1030 630"/>
      <path d="M1100 625 Q1155 635 1205 615"/>
      <path d="M740 620 Q785 630 820 618"/>
      <path d="M930 555 Q980 545 1030 560"/>
      <path d="M850 575 Q900 565 950 580"/>
      <path d="M1070 650 Q1120 660 1170 645"/>
    </g>

    <!-- Barberries (Зирк) -->
    <g fill="#881337">
      <circle cx="860" cy="570" r="9"/>
      <circle cx="1060" cy="590" r="8"/>
      <circle cx="940" cy="625" r="10"/>
      <circle cx="1135" cy="605" r="9"/>
      <circle cx="795" cy="605" r="8"/>
      <circle cx="1035" cy="540" r="9"/>
      <circle cx="905" cy="545" r="8"/>
      <circle cx="1180" cy="625" r="8"/>
      <circle cx="820" cy="635" r="9"/>
      <circle cx="990" cy="655" r="9"/>
    </g>

    <!-- Tender Roasted Meat Chunks (Казан-кабоб / Баранина) -->
    <g>
      <!-- Center meat chunks -->
      <path d="M870 515 C830 495 915 450 990 470 C1065 490 1075 545 1030 565 C985 585 905 535 870 515 Z" fill="url(#meatGrad)" filter="url(#softShadow)"/>
      <!-- Left juicy meat chunk -->
      <path d="M745 540 C715 520 790 490 840 510 C880 530 860 570 820 585 C780 595 755 560 745 540 Z" fill="url(#meatGrad)" filter="url(#softShadow)"/>
      <!-- Right juicy meat chunk -->
      <path d="M1060 525 C1040 495 1125 485 1175 515 C1215 540 1185 585 1135 585 C1095 585 1070 545 1060 525 Z" fill="url(#meatGrad)" filter="url(#softShadow)"/>
      <!-- Meat glaze highlights -->
      <path d="M900 490 Q960 500 1005 510" stroke="#f43f5e" stroke-width="4.5" fill="none" opacity="0.6"/>
      <path d="M770 525 Q805 518 835 532" stroke="#f43f5e" stroke-width="4" fill="none" opacity="0.6"/>
      <path d="M1095 510 Q1135 515 1165 530" stroke="#f43f5e" stroke-width="4" fill="none" opacity="0.6"/>
    </g>

    <!-- Roasted Whole Garlic Head (Чеснок) -->
    <g filter="url(#softShadow)">
      <ellipse cx="960" cy="465" rx="55" ry="50" fill="url(#garlicGrad)"/>
      <path d="M960 420 C945 435 938 475 945 510" stroke="#854d0e" stroke-width="3" fill="none"/>
      <path d="M960 420 C975 435 982 475 975 510" stroke="#854d0e" stroke-width="3" fill="none"/>
      <path d="M960 420 L960 515" stroke="#854d0e" stroke-width="3" fill="none"/>
      <path d="M955 420 Q960 400 965 420" stroke="#713f12" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Hot Red Chili Pepper (Стручковый перец) -->
    <g filter="url(#softShadow)">
      <path d="M1050 550 Q1145 540 1220 580 Q1145 570 1050 562 Z" fill="#dc2626"/>
      <path d="M1050 550 C1042 546 1046 538 1040 534" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Atmospheric Steam / Aroma rising -->
  <g opacity="0.5" stroke="#fef3c7" stroke-linecap="round" fill="none" filter="url(#plovGlow)">
    <path d="M880 480 Q840 380 900 280 Q960 180 920 100" stroke-width="8" opacity="0.3"/>
    <path d="M960 440 Q1020 340 950 240 Q890 140 970 80" stroke-width="12" opacity="0.45"/>
    <path d="M1060 480 Q1130 370 1050 270 Q980 170 1040 90" stroke-width="9" opacity="0.3"/>
  </g>

  <!-- Glowing embers sparks -->
  <g fill="#fbbf24">
    <circle cx="650" cy="500" r="4" opacity="0.6"/>
    <circle cx="720" cy="420" r="3" opacity="0.8"/>
    <circle cx="1200" cy="460" r="4" opacity="0.5"/>
    <circle cx="1280" cy="380" r="3.5" opacity="0.7"/>
    <circle cx="890" cy="320" r="3" opacity="0.6"/>
    <circle cx="1040" cy="300" r="3" opacity="0.7"/>
  </g>
</svg>