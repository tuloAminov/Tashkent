<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <radialGradient id="bgLepeshka" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#191008"/>
    </radialGradient>
    <radialGradient id="breadRim" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="breadCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="breadShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="500" height="350" fill="url(#bgLepeshka)"/>

  <!-- Warm background glow -->
  <circle cx="250" cy="175" r="140" fill="#f59e0b" opacity="0.12"/>

  <!-- Uzbek flatbread (Лепёшка из тандыра) -->
  <g filter="url(#breadShadow)">
    <!-- Outer puffed crust -->
    <ellipse cx="250" cy="180" rx="170" ry="115" fill="url(#breadRim)"/>

    <!-- Puffy rim inner edge -->
    <ellipse cx="250" cy="180" rx="142" ry="92" fill="#d97706" opacity="0.6"/>

    <!-- Flat stamped center (Чекич) -->
    <ellipse cx="250" cy="180" rx="95" ry="60" fill="url(#breadCenter)" stroke="#b45309" stroke-width="2"/>

    <!-- Chekich stamped pattern (dots and rays) -->
    <g fill="#78350f">
      <!-- Center flower/star -->
      <circle cx="250" cy="180" r="4"/>
      <!-- Inner ring of stamps -->
      <circle cx="250" cy="165" r="2.5"/>
      <circle cx="250" cy="195" r="2.5"/>
      <circle cx="230" cy="180" r="2.5"/>
      <circle cx="270" cy="180" r="2.5"/>
      <circle cx="236" cy="169" r="2.5"/>
      <circle cx="264" cy="169" r="2.5"/>
      <circle cx="236" cy="191" r="2.5"/>
      <circle cx="264" cy="191" r="2.5"/>

      <!-- Outer ring of chekich points -->
      <circle cx="250" cy="148" r="3"/>
      <circle cx="250" cy="212" r="3"/>
      <circle cx="205" cy="180" r="3"/>
      <circle cx="295" cy="180" r="3"/>
      <circle cx="218" cy="158" r="3"/>
      <circle cx="282" cy="158" r="3"/>
      <circle cx="218" cy="202" r="3"/>
      <circle cx="282" cy="202" r="3"/>
      <circle cx="234" cy="152" r="3"/>
      <circle cx="266" cy="152" r="3"/>
      <circle cx="234" cy="208" r="3"/>
      <circle cx="266" cy="208" r="3"/>
    </g>

    <!-- Concentric stamped arcs in center -->
    <ellipse cx="250" cy="180" rx="65" ry="40" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="4 4"/>
    <ellipse cx="250" cy="180" rx="35" ry="22" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Nigella / Black cumin seeds (Седана) on the rim -->
    <g fill="#18181b">
      <circle cx="160" cy="170" r="2.2"/>
      <circle cx="180" cy="140" r="2.4"/>
      <circle cx="210" cy="120" r="2.2"/>
      <circle cx="250" cy="110" r="2.5"/>
      <circle cx="290" cy="120" r="2.2"/>
      <circle cx="320" cy="140" r="2.4"/>
      <circle cx="340" cy="170" r="2.2"/>
      <circle cx="330" cy="200" r="2.3"/>
      <circle cx="295" cy="230" r="2.4"/>
      <circle cx="250" cy="242" r="2.5"/>
      <circle cx="205" cy="230" r="2.2"/>
      <circle cx="170" cy="200" r="2.3"/>
    </g>

    <!-- Golden toasted spots on rim from tandoor oven heat -->
    <ellipse cx="330" cy="160" rx="14" ry="9" fill="#78350f" opacity="0.35"/>
    <ellipse cx="170" cy="185" rx="12" ry="8" fill="#78350f" opacity="0.3"/>
    <ellipse cx="270" cy="115" rx="15" ry="8" fill="#78350f" opacity="0.35"/>
  </g>

  <!-- Steam -->
  <path d="M235 90 Q220 60 240 30" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M265 80 Q280 50 260 25" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
