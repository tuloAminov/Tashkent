<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="chefBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#362217"/>
      <stop offset="60%" stop-color="#1f130b"/>
      <stop offset="100%" stop-color="#0d0704"/>
    </radialGradient>
    <linearGradient id="chefApron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c25e24"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="chefHat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="chefShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#chefBg)"/>

  <!-- Warm background glow -->
  <circle cx="300" cy="180" r="170" fill="#f59e0b" opacity="0.15"/>

  <!-- Kazan in foreground -->
  <path d="M60 400 C60 280 280 280 280 400 Z" fill="#1e293b"/>
  <ellipse cx="170" cy="300" rx="100" ry="24" fill="#334155" stroke="#475569" stroke-width="2"/>
  <ellipse cx="170" cy="300" rx="88" ry="18" fill="#d97706"/>
  <!-- Rising steam from kazan -->
  <path d="M140 280 Q125 240 145 200" stroke="#fef3c7" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M175 275 Q190 230 165 190" stroke="#fef3c7" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- --- CHEF FIGURE (Ошпаз / Мастер плова) --- -->
  <g filter="url(#chefShadow)">
    <!-- Body / Shoulders -->
    <path d="M230 400 L240 230 C240 190 380 190 380 230 L390 400 Z" fill="#f8fafc"/>

    <!-- Traditional Branded Apron with eastern trim -->
    <path d="M260 220 L360 220 L370 400 L250 400 Z" fill="url(#chefApron)"/>
    <!-- Apron neck strap -->
    <path d="M280 220 L295 180 M340 220 L325 180" stroke="#9a3412" stroke-width="5" stroke-linecap="round"/>
    <!-- Eastern ornament on apron pocket -->
    <rect x="285" y="270" width="50" height="45" rx="6" fill="#7c2d12" stroke="#fde047" stroke-width="2"/>
    <circle cx="310" cy="292" r="8" fill="#f59e0b"/>

    <!-- Neck & Face -->
    <rect x="295" y="165" width="30" height="25" rx="5" fill="#fcd34d"/>
    <ellipse cx="310" cy="145" rx="28" ry="32" fill="#fcd34d"/>

    <!-- Friendly smile, mustache & beard -->
    <ellipse cx="298" cy="140" rx="3" ry="2" fill="#262626"/>
    <ellipse cx="322" cy="140" rx="3" ry="2" fill="#262626"/>
    <!-- Mustache -->
    <path d="M292 153 Q310 160 328 153 Q310 150 292 153 Z" fill="#262626"/>
    <!-- Smile -->
    <path d="M302 162 Q310 168 318 162" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Chef Cap (Традиционный восточный белый колпак) -->
    <!-- Cap base band -->
    <rect x="278" y="112" width="64" height="15" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Puffy cap crown -->
    <path d="M276 112 C260 70 300 45 310 45 C320 45 360 70 344 112 Z" fill="url(#chefHat)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Cap pleat folds -->
    <path d="M295 112 Q290 75 305 50" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <path d="M325 112 Q330 75 315 50" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>

    <!-- Arms -->
    <!-- Right arm holding large skimmer (Капгир) -->
    <path d="M375 225 Q420 270 390 310" stroke="#f8fafc" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="388" cy="312" r="14" fill="#fcd34d"/>

    <!-- Large Uzbek Skimmer (Капгир для плова) -->
    <!-- Long wooden & brass handle -->
    <line x1="430" y1="210" x2="200" y2="330" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
    <line x1="380" y1="237" x2="200" y2="330" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
    <!-- Perforated round skimmer blade -->
    <circle cx="195" cy="335" r="30" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Skimmer holes -->
    <g fill="#475569">
      <circle cx="195" cy="335" r="3"/>
      <circle cx="185" cy="328" r="2.5"/>
      <circle cx="205" cy="328" r="2.5"/>
      <circle cx="185" cy="342" r="2.5"/>
      <circle cx="205" cy="342" r="2.5"/>
      <circle cx="175" cy="335" r="2.5"/>
      <circle cx="215" cy="335" r="2.5"/>
    </g>

    <!-- Golden grains of rice on skimmer -->
    <g fill="#fde047">
      <ellipse cx="192" cy="332" rx="4" ry="2" transform="rotate(30 192 332)"/>
      <ellipse cx="202" cy="338" rx="4" ry="2" transform="rotate(-20 202 338)"/>
    </g>
  </g>
</svg>
