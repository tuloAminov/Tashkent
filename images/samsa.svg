<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <radialGradient id="bgSamsa" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b2b1a"/>
      <stop offset="100%" stop-color="#191108"/>
    </radialGradient>
    <linearGradient id="pastryGrad1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="pastryGrad2" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="samsaDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="500" height="350" fill="url(#bgSamsa)"/>

  <!-- Warm background glow -->
  <circle cx="250" cy="180" r="140" fill="#f59e0b" opacity="0.12"/>

  <!-- Wooden serving board -->
  <ellipse cx="250" cy="225" rx="200" ry="80" fill="#78350f" stroke="#92400e" stroke-width="3"/>
  <ellipse cx="250" cy="223" rx="185" ry="72" fill="#58240a"/>

  <!-- Samsa 1 (Left background) -->
  <g filter="url(#samsaDrop)">
    <path d="M130 190 Q180 120 220 170 Q240 220 180 230 Q120 230 130 190 Z" fill="url(#pastryGrad2)"/>
    <!-- Flaky crust folds -->
    <path d="M145 185 Q175 145 205 175" stroke="#78350f" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M160 215 Q195 195 215 180" stroke="#78350f" stroke-width="1.8" fill="none" opacity="0.6"/>
    <!-- Black cumin seeds (Седана) -->
    <circle cx="170" cy="170" r="2" fill="#18181b"/>
    <circle cx="185" cy="160" r="2.2" fill="#18181b"/>
    <circle cx="195" cy="180" r="1.8" fill="#18181b"/>
    <circle cx="160" cy="190" r="2" fill="#18181b"/>
  </g>

  <!-- Samsa 2 (Right background) -->
  <g filter="url(#samsaDrop)">
    <path d="M280 170 Q320 120 370 190 Q380 230 320 230 Q260 220 280 170 Z" fill="url(#pastryGrad2)"/>
    <path d="M295 175 Q325 145 355 185" stroke="#78350f" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- White sesame seeds (Кунжут) -->
    <ellipse cx="320" cy="165" rx="2.5" ry="1.5" fill="#fef08a" transform="rotate(30 320 165)"/>
    <ellipse cx="335" cy="175" rx="2.5" ry="1.5" fill="#fef08a" transform="rotate(-20 335 175)"/>
    <ellipse cx="310" cy="185" rx="2.5" ry="1.5" fill="#fef08a" transform="rotate(10 310 185)"/>
    <circle cx="340" cy="190" r="2" fill="#18181b"/>
  </g>

  <!-- Samsa 3 (Center foreground - triangular classic tandoor samsa) -->
  <g filter="url(#samsaDrop)">
    <!-- Triangular puffy body -->
    <path d="M250 120 Q315 200 320 230 Q250 250 180 230 Q185 200 250 120 Z" fill="url(#pastryGrad1)"/>
    <!-- Triangular crust spiral folds -->
    <path d="M250 140 Q290 190 295 215" stroke="#92400e" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M250 140 Q210 190 205 215" stroke="#92400e" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M210 215 Q250 230 290 215" stroke="#92400e" stroke-width="2.5" fill="none" opacity="0.7"/>
    
    <!-- Egg wash glossy highlights -->
    <path d="M245 135 Q270 170 280 185" stroke="#fef08a" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M235 160 Q225 190 220 205" stroke="#fef08a" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- Nigella / Black Cumin and white sesame seeds on top -->
    <circle cx="245" cy="165" r="2.2" fill="#09090b"/>
    <circle cx="260" cy="160" r="2.5" fill="#09090b"/>
    <circle cx="250" cy="180" r="2.4" fill="#09090b"/>
    <circle cx="235" cy="175" r="2.2" fill="#09090b"/>
    <circle cx="270" cy="178" r="2" fill="#09090b"/>
    <circle cx="240" cy="195" r="2.5" fill="#09090b"/>
    <circle cx="260" cy="195" r="2.2" fill="#09090b"/>
    <circle cx="275" cy="195" r="2" fill="#09090b"/>
    <circle cx="225" cy="190" r="2.2" fill="#09090b"/>
    <!-- Sesame -->
    <ellipse cx="252" cy="150" rx="3" ry="1.5" fill="#fefce8" transform="rotate(35 252 150)"/>
    <ellipse cx="265" cy="170" rx="3" ry="1.5" fill="#fefce8" transform="rotate(-25 265 170)"/>
    <ellipse cx="230" cy="180" rx="3" ry="1.5" fill="#fefce8" transform="rotate(15 230 180)"/>
    <ellipse cx="255" cy="188" rx="3" ry="1.5" fill="#fefce8" transform="rotate(-40 255 188)"/>
  </g>

  <!-- Hot fresh steam -->
  <path d="M250 100 Q235 70 255 40" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
