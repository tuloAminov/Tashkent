<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <radialGradient id="bgSuzma" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#243028"/>
      <stop offset="100%" stop-color="#0f1712"/>
    </radialGradient>
    <radialGradient id="bowlGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="90%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <radialGradient id="suzmaCream" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="bowlDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="500" height="350" fill="url(#bgSuzma)"/>

  <!-- Backdrop glow -->
  <circle cx="250" cy="180" r="140" fill="#10b981" opacity="0.1"/>

  <!-- Bowl -->
  <g filter="url(#bowlDrop)">
    <ellipse cx="250" cy="200" rx="175" ry="85" fill="url(#bowlGrad)"/>
    <ellipse cx="250" cy="198" rx="160" ry="75" fill="#f8fafc" stroke="#34d399" stroke-width="2.5"/>
    <ellipse cx="250" cy="195" rx="145" ry="65" fill="url(#suzmaCream)"/>
  </g>

  <!-- Cream swirls (Ложкой сделанные волны сузьмы) -->
  <path d="M170 195 Q210 180 250 195 Q290 210 330 195" stroke="#e2e8f0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M190 205 Q240 195 280 205 Q305 210 320 200" stroke="#e2e8f0" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Olive oil swirl in center groove -->
  <path d="M205 190 Q240 180 270 192 Q295 200 275 208 Q240 212 220 202" fill="none" stroke="#ca8a04" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
  <ellipse cx="245" cy="196" rx="8" ry="4" fill="#eab308" opacity="0.8"/>

  <!-- Minced fresh dill & cilantro (Укроп и кинза) -->
  <g fill="#15803d">
    <!-- Dill needles / sprigs -->
    <path d="M210 175 L218 170 M214 172 L216 168 M216 174 L220 171" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <path d="M270 180 L280 176 M274 178 L277 174 M278 180 L282 178" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <path d="M240 210 L250 205 M244 207 L246 203" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Chopped green speckles -->
    <circle cx="185" cy="190" r="2"/>
    <circle cx="195" cy="180" r="2.5"/>
    <circle cx="230" cy="185" r="2.2"/>
    <circle cx="260" cy="188" r="2.5"/>
    <circle cx="300" cy="190" r="2"/>
    <circle cx="285" cy="205" r="2.2"/>
    <circle cx="220" cy="205" r="2"/>
    <circle cx="250" cy="218" r="2.2"/>
    <circle cx="310" cy="198" r="1.8"/>
  </g>

  <!-- Whole cilantro leaf on top -->
  <path d="M250 170 C240 160 250 150 260 160 C270 150 280 160 270 170 C260 175 255 175 250 170 Z" fill="#22c55e"/>

  <!-- Red paprika / Sumac dusting -->
  <g fill="#b91c1c" opacity="0.8">
    <circle cx="215" cy="185" r="1.2"/>
    <circle cx="225" cy="195" r="1.5"/>
    <circle cx="255" cy="178" r="1.4"/>
    <circle cx="285" cy="188" r="1.5"/>
    <circle cx="240" cy="202" r="1.2"/>
    <circle cx="270" cy="202" r="1.4"/>
  </g>
</svg>
