<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <radialGradient id="bgSamarkand" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#362312"/>
      <stop offset="100%" stop-color="#140d07"/>
    </radialGradient>
    <radialGradient id="plateSamarkand" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="riceSamarkand" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <linearGradient id="beefCut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
  </defs>

  <rect width="500" height="350" fill="url(#bgSamarkand)"/>
  
  <!-- Backdrop glow -->
  <circle cx="250" cy="190" r="140" fill="#facc15" opacity="0.12"/>

  <!-- Platter -->
  <ellipse cx="250" cy="200" rx="195" ry="95" fill="url(#plateSamarkand)"/>
  <ellipse cx="250" cy="200" rx="180" ry="86" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <ellipse cx="250" cy="200" rx="160" ry="76" fill="#fefce8"/>

  <!-- Light saffron rice base -->
  <ellipse cx="250" cy="198" rx="142" ry="60" fill="url(#riceSamarkand)"/>

  <!-- Golden & Black Raisins (Кишмиш) -->
  <g fill="#451a03">
    <ellipse cx="210" cy="190" rx="4.5" ry="3"/>
    <ellipse cx="260" cy="180" rx="4.5" ry="3"/>
    <ellipse cx="235" cy="215" rx="5" ry="3.5"/>
    <ellipse cx="295" cy="205" rx="4.5" ry="3"/>
    <ellipse cx="180" cy="200" rx="4" ry="2.5"/>
    <ellipse cx="320" cy="195" rx="4.5" ry="3"/>
  </g>

  <!-- Chickpeas (Нут) -->
  <g fill="#fde047" stroke="#ca8a04" stroke-width="1.5">
    <circle cx="230" cy="185" r="5.5"/>
    <circle cx="280" cy="188" r="5.5"/>
    <circle cx="205" cy="210" r="5"/>
    <circle cx="255" cy="212" r="5.5"/>
    <circle cx="290" cy="220" r="5"/>
    <circle cx="170" cy="195" r="5"/>
    <circle cx="310" cy="210" r="5"/>
  </g>

  <!-- Carrots layer (Sariq sabzi) -->
  <g stroke="#f97316" stroke-width="3.5" stroke-linecap="round">
    <path d="M195 190 Q215 186 235 192"/>
    <path d="M265 185 Q285 180 305 187"/>
    <path d="M220 205 Q240 210 260 203"/>
    <path d="M275 202 Q295 205 315 198"/>
  </g>

  <!-- Large tender pieces of beef on top -->
  <g>
    <path d="M210 160 C195 145 230 135 260 145 C285 155 275 178 255 180 C235 182 215 172 210 160 Z" fill="url(#beefCut)"/>
    <path d="M265 155 C250 142 290 135 315 150 C330 162 320 180 300 182 C285 184 270 170 265 155 Z" fill="url(#beefCut)"/>
    <!-- Glaze lines -->
    <path d="M225 152 Q245 155 260 160" stroke="#fb7185" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M280 150 Q300 152 312 160" stroke="#fb7185" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Barberry red gems -->
  <g fill="#991b1b">
    <circle cx="225" cy="175" r="3.5"/>
    <circle cx="270" cy="172" r="3.5"/>
    <circle cx="245" cy="195" r="3"/>
    <circle cx="285" cy="196" r="3.5"/>
    <circle cx="195" cy="202" r="3"/>
  </g>

  <!-- Steam -->
  <path d="M240 115 Q225 90 245 65" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M265 105 Q280 80 260 55" stroke="#fef3c7" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75"/>
</svg>
