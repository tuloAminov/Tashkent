<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <radialGradient id="bgAyran" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e2e28"/>
      <stop offset="100%" stop-color="#0b1310"/>
    </radialGradient>
    <linearGradient id="ayranLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="ayranGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="500" height="350" fill="url(#bgAyran)"/>

  <!-- Cold ambient glow -->
  <circle cx="250" cy="180" r="140" fill="#38bdf8" opacity="0.1"/>

  <!-- Table -->
  <ellipse cx="250" cy="275" rx="200" ry="50" fill="#0f172a"/>

  <!-- Glass Shadow -->
  <ellipse cx="250" cy="270" rx="65" ry="18" fill="#000000" opacity="0.5"/>

  <!-- Frothy Ayran Glass Body -->
  <path d="M205 130 L218 260 C218 270 282 270 282 260 L295 130 Z" fill="url(#ayranLiquid)"/>

  <!-- Ice cubes inside -->
  <rect x="220" y="160" width="22" height="22" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" opacity="0.4" transform="rotate(15 220 160)"/>
  <rect x="250" y="180" width="20" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" opacity="0.4" transform="rotate(-10 250 180)"/>

  <!-- Finely chopped herbs / cucumber floating in ayran -->
  <g fill="#16a34a" opacity="0.85">
    <circle cx="230" cy="150" r="2"/>
    <circle cx="265" cy="145" r="2.2"/>
    <circle cx="245" cy="160" r="1.8"/>
    <circle cx="275" cy="170" r="2"/>
    <circle cx="225" cy="180" r="1.8"/>
    <circle cx="255" cy="200" r="2.2"/>
    <circle cx="235" cy="225" r="2"/>
    <circle cx="265" cy="235" r="1.8"/>
  </g>

  <!-- Creamy foam bubbles at top -->
  <g fill="#f8fafc">
    <circle cx="215" cy="132" r="7"/>
    <circle cx="230" cy="130" r="8"/>
    <circle cx="248" cy="128" r="9"/>
    <circle cx="266" cy="130" r="8.5"/>
    <circle cx="283" cy="132" r="7.5"/>
    <!-- Small bubbles -->
    <circle cx="225" cy="125" r="4"/>
    <circle cx="240" cy="123" r="5"/>
    <circle cx="258" cy="123" r="5"/>
    <circle cx="272" cy="125" r="4.5"/>
  </g>

  <!-- Glass overlay with reflection & cold frost -->
  <path d="M200 125 L215 262 C215 273 285 273 285 262 L300 125 Z" fill="url(#ayranGlass)" stroke="#e2e8f0" stroke-width="2"/>
  <ellipse cx="250" cy="125" rx="50" ry="12" fill="#ffffff" opacity="0.3"/>

  <!-- Condensation droplets on cold glass -->
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="222" cy="170" rx="1.5" ry="3"/>
    <ellipse cx="220" cy="205" rx="1.5" ry="4"/>
    <ellipse cx="280" cy="185" rx="1.5" ry="3"/>
    <ellipse cx="278" cy="225" rx="1.5" ry="3.5"/>
    <circle cx="228" cy="235" r="1.5"/>
    <circle cx="272" cy="200" r="1.5"/>
  </g>

  <!-- Fresh vibrant green mint leaves on glass rim -->
  <g>
    <path d="M260 125 Q275 105 290 100 Q285 115 270 126 Z" fill="#22c55e"/>
    <path d="M260 125 Q275 105 290 100" stroke="#15803d" stroke-width="1.5" fill="none"/>
    <path d="M265 125 Q255 102 240 105 Q245 118 260 126 Z" fill="#16a34a"/>
    <path d="M265 125 Q255 102 240 105" stroke="#14532d" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Fresh cucumber slice garnish on glass rim -->
  <ellipse cx="220" cy="125" rx="18" ry="10" fill="#86efac" stroke="#15803d" stroke-width="2.5" transform="rotate(-30 220 125)"/>
  <ellipse cx="220" cy="125" rx="13" ry="7" fill="#bbf7d0" transform="rotate(-30 220 125)"/>
</svg>
